
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: medicine-postgres
    environment:
      POSTGRES_DB: skill_exam_2400030533
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_exam_2400030533"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./CrudService
      dockerfile: Dockerfile
    image: docker-skill-exam-2400030533:latest
    container_name: medicine-backend
    ports:
      - "0533:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill_exam_2400030533
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_PORT: 8001
    depends_on:
      postgresdb:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
